name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Set up Prowler with Huawei Cloud provider
        run: |
          bash scripts/setup-prowler.sh python

      - name: Run tests
        run: |
          pytest -v --tb=short

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
          pip install ruff

      - name: Set up Prowler with Huawei Cloud provider
        run: |
          bash scripts/setup-prowler.sh python

      - name: Run ruff check
        run: |
          ruff check prowler/providers/huaweicloud/ tests/ || true

      - name: Run ruff format check
        run: |
          ruff format --check prowler/providers/huaweicloud/ tests/ || true
