services:
  api-dev-init:
    image: busybox:1.37.0@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
    volumes:
      - ./_data/api:/data
    command: ["sh", "-c", "chown -R 1000:1000 /data"]
    restart: "no"

  api-dev:
    hostname: "prowler-api"
    image: prowler-api-dev
    build:
      context: .
      dockerfile: api/Dockerfile
      target: dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.django.devel
      - DJANGO_LOGGING_FORMATTER=${LOGGING_FORMATTER:-human_readable}
    env_file:
      - path: .env
        required: false
    ports:
      - "${DJANGO_PORT:-8080}:${DJANGO_PORT:-8080}"
    volumes:
      - ./api/src/backend:/home/prowler/backend
      - ./api/pyproject.toml:/home/prowler/pyproject.toml
      - ./api/docker-entrypoint.sh:/home/prowler/docker-entrypoint.sh
      - ./prowler/providers/huaweicloud:/home/prowler/.venv/lib/python3.12/site-packages/prowler/providers/huaweicloud
      - ./api/prowler_patches/lib/check/models.py:/home/prowler/.venv/lib/python3.12/site-packages/prowler/lib/check/models.py
      - ./api/prowler_patches/lib/check/check.py:/home/prowler/.venv/lib/python3.12/site-packages/prowler/lib/check/check.py
      - ./api/prowler_patches/lib/outputs/finding.py:/home/prowler/.venv/lib/python3.12/site-packages/prowler/lib/outputs/finding.py
      - ./api/prowler_patches/lib/outputs/outputs.py:/home/prowler/.venv/lib/python3.12/site-packages/prowler/lib/outputs/outputs.py
      - ./api/prowler_patches/providers/common/provider.py:/home/prowler/.venv/lib/python3.12/site-packages/prowler/providers/common/provider.py
      - ./_data/api:/home/prowler/.config/prowler-api
      - outputs:/tmp/prowler_api_output
    depends_on:
      api-dev-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:${DJANGO_PORT:-8080}/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    entrypoint:
      - "/home/prowler/docker-entrypoint.sh"
      - "dev"
    restart: unless-stopped

  ui-dev:
    build:
      context: ./ui
      dockerfile: Dockerfile
      target: dev
    command: ["pnpm", "run", "dev"]
    environment:
      - NODE_ENV=development
      - NODE_OPTIONS=--max-old-space-size=4096 --no-deprecation
    env_file:
      - path: .env
        required: false
    ports:
      - 3000:3000
    volumes:
      - "./ui:/app"
      - "/app/node_modules"
    restart: unless-stopped
    dns_search: [""]
    depends_on:
      mcp-server:
        condition: service_healthy

  postgres:
    image: postgres:16.3-alpine3.20@sha256:36ed71227ae36305d26382657c0b96cbaf298427b3f1eaeb10d77a6dea3eec41
    hostname: "postgres-db"
    volumes:
      - ./_data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_ADMIN_USER}
      - POSTGRES_PASSWORD=${POSTGRES_ADMIN_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    env_file:
      - path: .env
        required: false
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}'",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  valkey:
    image: valkey/valkey:7-alpine3.19@sha256:4054fe7fc607b9326ac7c4691ed26e9670d2ff17a9fb28c2577adecf928acbcc
    hostname: "valkey"
    volumes:
      - ./_data/valkey:/data
    env_file:
      - path: .env
        required: false
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'valkey-cli ping'"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker-dev:
    image: prowler-api-dev
    # Give Celery soft shutdown time to drain/re-queue in-flight tasks on stop.
    stop_grace_period: 120s
    build:
      context: .
      dockerfile: api/Dockerfile
      target: dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.django.devel
    env_file:
      - path: .env
        required: false
    volumes:
      - ./api/src/backend:/home/prowler/backend
      - ./api/pyproject.toml:/home/prowler/pyproject.toml
      - ./api/docker-entrypoint.sh:/home/prowler/docker-entrypoint.sh
      - ./prowler/providers/huaweicloud:/home/prowler/.venv/lib/python3.12/site-packages/prowler/providers/huaweicloud
      - ./api/prowler_patches/lib/check/models.py:/home/prowler/.venv/lib/python3.12/site-packages/prowler/lib/check/models.py
      - ./api/prowler_patches/lib/check/check.py:/home/prowler/.venv/lib/python3.12/site-packages/prowler/lib/check/check.py
      - ./api/prowler_patches/lib/outputs/finding.py:/home/prowler/.venv/lib/python3.12/site-packages/prowler/lib/outputs/finding.py
      - ./api/prowler_patches/lib/outputs/outputs.py:/home/prowler/.venv/lib/python3.12/site-packages/prowler/lib/outputs/outputs.py
      - ./api/prowler_patches/providers/common/provider.py:/home/prowler/.venv/lib/python3.12/site-packages/prowler/providers/common/provider.py
      - outputs:/tmp/prowler_api_output
    depends_on:
      api-dev:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    entrypoint:
      - "/home/prowler/docker-entrypoint.sh"
      - "worker"
    restart: unless-stopped

  worker-beat:
    image: prowler-api-dev
    build:
      context: .
      dockerfile: api/Dockerfile
      target: dev
    environment:
      - DJANGO_SETTINGS_MODULE=config.django.devel
    env_file:
      - path: ./.env
        required: false
    depends_on:
      api-dev:
        condition: service_healthy
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    entrypoint:
      - "/home/prowler/docker-entrypoint.sh"
      - "beat"
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    environment:
      - PROWLER_MCP_TRANSPORT_MODE=http
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./mcp_server/prowler_mcp_server:/app/prowler_mcp_server
      - ./mcp_server/pyproject.toml:/app/pyproject.toml
      - ./mcp_server/entrypoint.sh:/app/entrypoint.sh
    command: ["uvicorn", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  outputs:
    driver: local
